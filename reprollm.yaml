schema_version: 1
project:
  name: lingshu-single-case
experiment:
  name: case-001-local-baseline
  profiles:
  - inference
  - trial_policy
models:
  primary:
    provider: other
    id: deepseek-chat
    endpoint:
      base_url: https://api.deepseek.com
    params:
      temperature: 1.0
      top_p: 1.0
      max_tokens: 4096
  vision:
    provider: other
    id: step-1v-8k
    endpoint:
      base_url: https://api.stepfun.com/v1
    params:
      temperature: 0.7
      top_p: 1.0
      max_tokens: 4095
prompts:
  vision:
    path: trial/prompts/vision.txt
  actor:
    path: trial/prompts/actor.txt
  instructor:
    path: trial/prompts/instructor.txt
  planner:
    path: trial/prompts/planner.txt
  informer:
    path: trial/prompts/informer.txt
  informer_wrapper:
    path: trial/prompts/informer_wrapper.txt
  summary:
    path: trial/prompts/summary.txt
  links:
    path: trial/prompts/links.txt
  report_meta:
    path: trial/prompts/report_meta.txt
  report_main:
    path: trial/prompts/report_main.txt
generation:
  temperature: 1.0
  top_p: 1.0
  max_tokens: 4096
inference:
  backend: other
execution:
  command: python backend/replay_case.py --mode local --case trial/cases/case-001.json
    --image trial/cases/case-001.png --config trial/configs/current.yaml --cassette
    trial/fixtures/external.json --output-dir trial/outputs/current
  cwd: .
  config_files:
  - trial/cases/case-001.json
  - trial/cases/case-001.png
  - trial/configs/current.yaml
  - trial/corpus/manifest.json
  - trial/fixtures/index-manifest.json
  - trial/fixtures/external.json
  - trial/fixtures/retrieval.json
  - trial/environment.json
bindings:
  generation.temperature:
    config: trial/configs/current.yaml:generation.temperature
  generation.top_p:
    config: trial/configs/current.yaml:generation.top_p
  generation.max_tokens:
    config: trial/configs/current.yaml:generation.max_tokens
custom:
  trial:
    mode: local
    case_id: case-001
    report_time: '2026-11-05T00:00:00Z'
    variant: baseline
  workflow:
    chat_turn_limit: 5
    planner_max_attempts: 2
    model_call_limit: 80
  rag:
    chunk_size: 200
    chunk_overlap: 20
    k: 2
    corpus_manifest: trial/corpus/manifest.json
    index_manifest: trial/assets-local/chroma-200/build-manifest.json
  assets:
    classifier_file: trial/assets-local/classifier/tongue_coating_resnet18.pth
    embedding_dir: trial/assets-local/gte
    persist_directory: trial/assets-local/chroma-200
artifacts:
  outputs:
  - trial/outputs/current/report.md
  - trial/outputs/current/trace.jsonl
  - trial/outputs/current/consumed.json
  - trial/outputs/current/result.json
